# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
# Antes de publicar pasa las pruebas; si fallan, no se publica nada.
name: Publicar la web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pruebas
        working-directory: web
        run: npm test

      # Solo se publica la web; el servidor, las pruebas y las capturas se quedan fuera
      - name: Preparar la carpeta publicada
        run: |
          cp -r web _sitio
          rm -rf _sitio/servidor _sitio/pruebas _sitio/capturas _sitio/package.json _sitio/README.md _sitio/.gitignore
          touch _sitio/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v5
