# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
# GitHub Pages sirve la rama gh-pages: este flujo pasa las pruebas y, si
# todo va bien, copia la web a esa rama. Si las pruebas fallan, no se publica.
name: Publicar la web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        working-directory: web
        run: npm test

      # Solo se publica la web; el servidor, las pruebas y las capturas se quedan fuera
      - name: Preparar la carpeta publicada
        run: |
          cp -r web _sitio
          rm -rf _sitio/servidor _sitio/pruebas _sitio/capturas _sitio/package.json _sitio/README.md _sitio/.gitignore
          touch _sitio/.nojekyll

      - name: Actualizar la rama gh-pages
        run: |
          cd _sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar la web (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
